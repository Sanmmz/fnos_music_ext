# 可选音源（至少启用一个）
# musicdl: https://github.com/CharlesPikachu/musicdl
# musicbox: https://github.com/darknessomi/musicbox
# lxmusic:  洛雪音乐源（LX Music 风格免登录解析：酷狗/网易/咪咕）
#
# 基础镜像 / pip / apt 源可由根目录 .env 覆盖（FNMUSIC_BASE_IMAGE / FNMUSIC_PIP_INDEX /
# FNMUSIC_APT_MIRROR），其中基础镜像由 ensure_base_image.sh 自动探测维护：
# 国内镜像优先直连（绕开 daemon 加速器），官方源兜底（不修改系统 Docker 配置，仅本应用构建生效）；
# apt 源默认清华镜像，仅在 musicdl 构建层内临时替换，失败自动回退官方源，最终镜像与宿主机不受影响
services:
  musicdl:
    build:
      context: ./musicdl-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${FNMUSIC_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
    container_name: fnmusic-musicdl
    ports:
      - "127.0.0.1:8768:8000"
    environment:
      - MUSICDL_SOURCES=KuwoMusicClient,MiguMusicClient
      - MUSICDL_SEARCH_TIMEOUT=12
      - MUSICDL_LIMIT_PER_SOURCE=10
      - MUSICDL_URL_TTL=1800
      - MUSICDL_CACHE_MAX=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  musicbox:
    build:
      context: ./musicbox-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: fnmusic-musicbox
    ports:
      - "0.0.0.0:8770:8000"
    volumes:
      - ./musicbox-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  lxmusic:
    build:
      context: ./lxmusic-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: fnmusic-lxmusic
    ports:
      - "127.0.0.1:8772:8000"
    environment:
      - LX_SOURCES=${LX_SOURCES:-kg,wy,mg,kw}
      - LX_SEARCH_TIMEOUT=${LX_SEARCH_TIMEOUT:-12}
      - LX_LIMIT_PER_SOURCE=${LX_LIMIT_PER_SOURCE:-20}
      - LX_THIRD_PARTY=${LX_THIRD_PARTY:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 喜马拉雅音源 xmly（宿主机端口 8774 -> 容器 8000）
  # 一个专辑 = 一部小说 = App 里的一个歌单；播放依赖扫码登录后的 VIP cookie
  xmly:
    build:
      context: ./xmly-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://mirrors.aliyun.com/pypi/simple}
    container_name: fnmusic-xmly
    ports:
      - "127.0.0.1:8774:8000"
    volumes:
      - ./xmly-data:/data
    environment:
      - XMLY_URL_TTL=1800
      - XMLY_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # 核心代理（接管 /var/run/trim_music.socket，零侵入扩展飞牛音乐）
  #
  # 容器化约束（fail-closed 安全机制要求）：
  #   * network_mode: host  —— 容器内 127.0.0.1 直达宿主机音源端口；管理台
  #                          TCP 8799 直接绑定宿主机，局域网可访问。
  #   * pid: host          —— takeover.py 用 SO_PEERCRED + /proc/<pid>/exe 校验
  #                          官方监听身份；共享宿主 PID 命名空间后校验逻辑不变。
  #   * /var/run:/var/run:rw —— renameat2 才能在宿主机 socket 路径上原子移动。
  #   * stop_grace_period  —— 给 supervise() 的 finally（复原官方 socket）留足时间。
  #   * 数据目录 bind 挂载  —— FNMUSIC_HOME=/app，故 cache/online_favorites/
  #                          play_history/recommend_cache 落在 /app 下，挂载宿主
  #                          既有目录以保留历史数据与收藏；官方 music.db 只读挂载。
  #
  # 部署模式由宿主 .env 的 FNMUSIC_PROXY_MODE 控制（host=systemd 回退，docker=容器）。
  # 一键拉起全部：docker compose up -d（含本服务与上面 4 个音源服务）。
  # =============================================================================
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: fnmusic-proxy
    network_mode: host
    pid: host
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      # 接管宿主机飞牛音乐 Unix socket（必须 rw）
      - /var/run:/var/run:rw
      # 接管状态（ownership.json 等），与 entrypoint --state-dir 一致，持久化
      - ./.runtime:/app/.runtime
      # 配置（可读写）：environment() 读取 /app/.env 注入环境变量；
      # 去掉 :ro 以便代理 Settings→Save 可回写 .env（否则 os.replace 跨文件系统 + 只读均失败）。
      - ./.env:/app/.env
      # 业务数据目录（FNMUSIC_HOME=/app 解析到此），挂载宿主既有目录保留数据
      - ./cache:/app/cache
      - ./online_favorites:/app/online_favorites
      - ./play_history:/app/play_history
      - ./recommend_cache:/app/recommend_cache
      # 网易云取流快通道：直连解析要读 musicbox 的登录 cookie（含 MUSIC_U）。
      # 旧配置没把 musicbox-data 挂进代理 => _netease_cookie_header() 恒为 None
      # => 每首歌都回落到慢速 musicbox 兜底（实测 1.4~17s）=> 撞取流启动超时 404。
      - ./musicbox-data:/app/musicbox-data:ro
      # 官方音乐库（只读）：FNMUSIC_MUSIC_DB 默认值
      - /usr/local/apps/@appdata/trim.music/db/music.db:/usr/local/apps/@appdata/trim.music/db/music.db:ro
      # 曲库所在存储池（**必须 rw**）：「收藏下载 / 播放下载 / 边听边存」的音频要落到飞牛共享曲库。
      # ★ 必须挂：不挂的话容器内 /vol02 只是个空目录（容器层），文件写完宿主机曲库里根本看不到，
      #   容器一重建还全丢 —— 表现就是「设置里开了下载，却一首都没下载」。
      # ★ 必须 rw：挂成 :ro 会直接 Read-only file system。
      #   （rclone 云盘是 fuse 挂载，但 rw bind mount 对它一样有效：实测容器内分块流式写 4MB 正常落盘。
      #    注意别用 dd 验证 —— dd 在这类 fuse 上会返回 0 字节 / Bad file descriptor，是假象。）
      #   若你的曲库在别的存储池（/vol01、/vol03…），照样子加一行即可。
      - /vol02:/vol02:rw
      # 本地备用落盘目录（可写）：对应 .env 的 FNMUSIC_TEE_SAVE_DIR=/app/downloads。
      # 曲库若落在 rclone 云盘上（写入较慢，实测约 1.5MB/s，一首 30MB 约 20s），
      # 可以把保存路径改成这个本地目录，再由飞牛把该目录加进音乐库。
      # 默认仍优先直接写曲库（/vol02/...），省一步导入。
      - ./downloads:/app/downloads:rw
    depends_on:
      musicdl:
        condition: service_healthy
      musicbox:
        condition: service_healthy
      lxmusic:
        condition: service_healthy
    healthcheck:
      # 复用 takeover.py ready：校验 target 为已记录的代理且 /_ext/healthz ok
      test: ["CMD", "/app/.venv-proxy/bin/python", "/app/proxy/takeover.py", "ready", "--state-dir", "/app/.runtime", "--timeout", "10"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
